modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "${mod_license}"
issueTrackerURL = "http://my.issue.tracker/" #optional

[[mods]] #mandatory
modId = "teupnepa" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="http://myurl.me/" #optional
#displayURL="http://example.com/" #optional
logoFile="TeUpNePa Icon.png" #optional
credits = "Thanks to Mickelus and Rolfmao, the authors of Tetra and Upgraded Netherite, for their assistance and permission to create this mod." #optional
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

[[dependencies.teupnepa]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "${forge_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"
# Here's another dependency
[[dependencies.teupnepa]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.teupnepa]]
modId = "tetra"
mandatory = true
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"